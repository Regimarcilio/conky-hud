-- Bloco 4/4 rodapé — TEMPO + BTC (bottom_left x=1023, 325px)
conky.config = {
    alignment = 'bottom_left',
    gap_x = 1023,
    gap_y = 12,
    minimum_width = 325,
    maximum_width = 325,
    own_window = true,
    own_window_class = 'ConkyBloco4',
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_colour = '1C150C',
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    stippled_borders = 0,
    use_xft = true,
    xftalpha = 1,
    font = 'Hack Nerd Font:size=9',
    update_interval = 1,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    background = true,
    short_units = true,
    pad_percents = 2,
    default_color = '#E8DCC3',
    color0 = '#D99A2B',
    color1 = '#D99A2B',
    color2 = '#A66A2C',
    color3 = '#D9A441',
    color4 = '#8C7B5D',
    color5 = '#A66A2C',
    color6 = '#C75B39',
}

conky.text = [[
${font Hack Nerd Font:size=9:bold}${color1}[ TEMPO · ${execi 3600 jq -r '.city // "—"' ~/.cache/conky/geo.json} ]$color$font${color #3A2E1F}${stippled_hr 1}$color
${execi 1800 ~/.config/conky/scripts/weather.sh > /dev/null}${font Hack Nerd Font:size=13:bold}${color0}${execi 300 ~/.config/conky/scripts/weather-icon.sh 0} ${execi 300 jq -r '.current_condition[0].temp_C' ~/.cache/conky/weather.json}°$font ${execi 300 ~/.config/conky/scripts/weather-desc.sh 0}${alignr}${font Hack Nerd Font:size=13:bold}${color2}${execi 60 ~/.config/conky/scripts/btc.sh}$font$color
${color4}HOJE máx ${execi 300 jq -r '.weather[0].maxtempC' ~/.cache/conky/weather.json}° · mín ${execi 300 jq -r '.weather[0].mintempC' ~/.cache/conky/weather.json}° · ${execi 600 ~/.config/conky/scripts/weather-icon.sh 1} ${execi 600 jq -r '"\(.weather[1].maxtempC)°/\(.weather[1].mintempC)°"' ~/.cache/conky/weather.json} · ${execi 600 ~/.config/conky/scripts/weather-icon.sh 2} ${execi 600 jq -r '"\(.weather[2].maxtempC)°/\(.weather[2].mintempC)°"' ~/.cache/conky/weather.json}$color
]]
