conky.config = {
    alignment = 'top_right',
    gap_x = 12,
    gap_y = 30,
    minimum_width = 320,
    maximum_width = 335,
    minimum_height = 500,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_colour = '1C150C',
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    stippled_borders = 0,
    use_xft = true,
    xftalpha = 1,
    font = 'Hack Nerd Font:size=9',
    update_interval = 1,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    background = true,
    short_units = true,
    pad_percents = 2,
    default_color = '#E8DCC3',
    color0 = '#D99A2B',
    color1 = '#D99A2B',
    color2 = '#A66A2C',
    color3 = '#D9A441',
    color4 = '#8C7B5D',
    color5 = '#A66A2C',
    color6 = '#C75B39',
}

conky.text = [[
${font Hack Nerd Font:size=22:bold}${color1}${alignr}${time %H:%M:%S}$font$color
${font Hack Nerd Font:size=9}${color3}${alignr}RELATÓRIO Nº 041 — ${time %d/%m}$font$color
${color #3A2E1F}${stippled_hr 1}$color
${voffset 2}${font Hack Nerd Font:size=9:bold}${color1}[ SISTEMA ]$color$font${color #3A2E1F}${stippled_hr 1}$color
${color4} Kernel:${color} ${kernel}${alignr}${color4} Up:${color} ${uptime_short}
${color4}󰣇 Load:${color} ${loadavg 1} ${loadavg 2} ${loadavg 3}${alignr}${color4} ${color}${user_names}
${voffset 2}${font Hack Nerd Font:size=9:bold}${color1}[ CPU · 2 NÚCLEOS ]$color$font${color #3A2E1F}${stippled_hr 1}$color${voffset 2}
${color4}TOTAL${goto 90}${color} ${cpu cpu0}%${alignr}${color4}${freq_g}GHz$color${voffset 2}
${color0}${cpubar cpu0 6,300}$color${voffset 2}
${color4}C0${goto 60}${color} ${cpu cpu1}% ${color0}${cpubar cpu1 5,105}${color4}${goto 225}󰔏 ${color}${hwmon 1 temp 2}°C$color
${color4}C1${goto 60}${color} ${cpu cpu2}% ${color0}${cpubar cpu2 5,105}${color4}${goto 225}󰔏 ${color}${hwmon 1 temp 3}°C$color${voffset 3}
${font Hack Nerd Font:size=9:bold}${color1}[ MEMÓRIA ]$color$font${color #3A2E1F}${stippled_hr 1}$color${voffset 2}
${color4}RAM${goto 90}${color} ${memperc}% ${color4}${mem}/${memmax}${alignr}${color}${memeasyfree} free$color${voffset 2}
${color2}${membar 6,300}$color${voffset 2}
${color4}󰳃 SWAP${goto 90}${color} ${swapperc}% ${color4}${swap}/${swapmax}$color${voffset 2}
${font Hack Nerd Font:size=9:bold}${color1}[ DISCOS ]$color$font${color #3A2E1F}${stippled_hr 1}$color${voffset 2}
${color4}/ root ${fs_used_perc /}%${goto 130}${color}${fs_used /}/${fs_size /}${alignr}${color4}${fs_free /} free$color${voffset 2}
${color2}${fs_bar 5,300 /}$color${voffset 3}
${color4}/home ${fs_used_perc /home}%${goto 130}${color}${fs_used /home}/${fs_size /home}${alignr}${color4}${fs_free /home} free$color${voffset 2}
${color0}${fs_bar 5,300 /home}$color${voffset 3}
${font Hack Nerd Font:size=9:bold}${color1}[ LINHA · REDE ]$color$font${color #3A2E1F}${stippled_hr 1}$color${voffset 2}
${if_up wlxe84e064fbde7}${color4}IP:${color} ${addr wlxe84e064fbde7}${alignr}${color4}SSID:${color} ${wireless_essid wlxe84e064fbde7}
${color4}▼ Down:${color} ${downspeedf wlxe84e064fbde7} kB/s${alignr}${color4}▲ Up:${color} ${upspeedf wlxe84e064fbde7} kB/s
${color0}${downspeedgraph wlxe84e064fbde7 18,140 3A2E1F D99A2B -t -l} ${color1}${upspeedgraph wlxe84e064fbde7 18,140 3A2E1F D99A2B -t -l}$color
${color4}Total ▼ ${color}${totaldown wlxe84e064fbde7}${alignr}${color4}Total ▲ ${color}${totalup wlxe84e064fbde7}$color
${else}${color6}󰖪 Interface offline — verifique o WiFi USB$color
${endif}${voffset 2}
${font Hack Nerd Font:size=9:bold}${color1}[ TEMPO · ${execi 3600 jq -r '.city // "—"' ~/.cache/conky/geo.json} ]$color$font${color #3A2E1F}${stippled_hr 1}$color${voffset 2}
${execi 1800 ~/.config/conky/scripts/weather.sh > /dev/null}${font Hack Nerd Font:size=13:bold}${color0}${execi 300 ~/.config/conky/scripts/weather-icon.sh 0} ${execi 300 jq -r '.current_condition[0].temp_C' ~/.cache/conky/weather.json}°$font ${execi 300 ~/.config/conky/scripts/weather-desc.sh 0} ${color4}(sens ${execi 300 jq -r '.current_condition[0].FeelsLikeC' ~/.cache/conky/weather.json}°)$color
${color4}HOJE máx ${execi 300 jq -r '.weather[0].maxtempC' ~/.cache/conky/weather.json}° · mín ${execi 300 jq -r '.weather[0].mintempC' ~/.cache/conky/weather.json}° · vento ${execi 300 jq -r '.current_condition[0].windspeedKmph' ~/.cache/conky/weather.json} km/h$color
${color4}${execi 3600 date -d +1day +%a}${color} ${execi 600 ~/.config/conky/scripts/weather-icon.sh 1} ${execi 600 jq -r '"\(.weather[1].maxtempC)°/\(.weather[1].mintempC)°"' ~/.cache/conky/weather.json} ${alignr}${color4}${execi 3600 date -d +2day +%a}${color} ${execi 600 ~/.config/conky/scripts/weather-icon.sh 2} ${execi 600 jq -r '"\(.weather[2].maxtempC)°/\(.weather[2].mintempC)°"' ~/.cache/conky/weather.json}$color
${voffset 2}${color #3A2E1F}${stippled_hr 1}$color
${alignc}${font Hack Nerd Font:size=9:bold}${color1}[ CÂMBIO · BTC ]$font$color
${alignc}${font Hack Nerd Font:size=18:bold}${color2}${execi 60 ~/.config/conky/scripts/btc.sh}$font$color
${alignc}${color4}USD • atualiza 60s$color
${color #3A2E1F}${stippled_hr 1}$color
${alignc}${color6}[ CONFIDENCIAL ]$color
]]
