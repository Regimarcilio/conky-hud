-- SÁLVIA NOTURNA v3.4 — clareira escura, layout COMPACTO (~470px), zero neon
-- Uso: wallpapers escuros/esverdeados. Troque via scripts/theme-switch.sh sage
-- Interface ativa: wlxe84e064fbde7 (auto-corrigida via start-conky.sh)
conky.config = {
    alignment = 'top_right',
    gap_x = 12,
    gap_y = 30,
    minimum_width = 320,
    maximum_width = 335,
    minimum_height = 470,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    stippled_borders = 0,
    use_xft = true,
    xftalpha = 1,
    font = 'Hack Nerd Font:size=9',
    update_interval = 1,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    background = true,
    short_units = true,
    pad_percents = 2,
    default_color = '#E3E8DF',
    color0 = '#9CAF88',
    color1 = '#9CAF88',
    color2 = '#D4C5A9',
    color3 = '#C9A86A',
    color4 = '#7A8B7F',
    color5 = '#D4C5A9',
    color6 = '#C26D5C',
}

conky.text = [[
${font Hack Nerd Font:size=22:bold}${color1}${alignr}${time %H:%M:%S}$font$color
${font Hack Nerd Font:size=9}${color3}${alignr}☾ ${time %A, %d de %B}$font$color
${color #2A352F}${stippled_hr 1}$color
${voffset 2}${font Hack Nerd Font:size=9:bold}${color1}❧ SYSTEM $color$font${color #2A352F}${stippled_hr 1}$color
${color4} Kernel:${color} ${kernel}${alignr}${color4} Up:${color} ${uptime_short}
${color4}󰣇 Load:${color} ${loadavg 1} ${loadavg 2} ${loadavg 3}${alignr}${color4} ${color}${user_names}
${voffset 2}${font Hack Nerd Font:size=9:bold}${color1}❧ CPU · DOIS ANÉIS $color$font${color #2A352F}${stippled_hr 1}$color${voffset 2}
${color4}TOTAL${goto 90}${color} ${cpu cpu0}%${alignr}${color4}${freq_g}GHz$color${voffset 2}
${color0}${cpubar cpu0 6,300}$color${voffset 2}
${color4}C0${goto 60}${color} ${cpu cpu1}% ${color0}${cpubar cpu1 5,105}${color4}${goto 225}󰔏 ${color}__CPU_TEMP_C0__°C$color
${color4}C1${goto 60}${color} ${cpu cpu2}% ${color0}${cpubar cpu2 5,105}${color4}${goto 225}󰔏 ${color}__CPU_TEMP_C1__°C$color${voffset 3}
${font Hack Nerd Font:size=9:bold}${color1}❧ SEIVA · MEM $color$font${color #2A352F}${stippled_hr 1}$color${voffset 2}
${color4}RAM${goto 90}${color} ${memperc}% ${color4}${mem}/${memmax}${alignr}${color}${memeasyfree} free$color${voffset 2}
${color2}${membar 6,300}$color${voffset 2}
${color4}󰳃 SWAP${goto 90}${color} ${swapperc}% ${color4}${swap}/${swapmax}$color${voffset 2}
${font Hack Nerd Font:size=9:bold}${color1}❧ SOLO · DISK $color$font${color #2A352F}${stippled_hr 1}$color${voffset 2}
${color4}/ root ${fs_used_perc /}%${goto 130}${color}${fs_used /}/${fs_size /}${alignr}${color4}${fs_free /} free$color${voffset 2}
${color2}${fs_bar 5,300 /}$color${voffset 3}
${color4}/home ${fs_used_perc /home}%${goto 130}${color}${fs_used /home}/${fs_size /home}${alignr}${color4}${fs_free /home} free$color${voffset 2}
${color0}${fs_bar 5,300 /home}$color${voffset 3}
${font Hack Nerd Font:size=9:bold}${color1}❧ VENTO · REDE $color$font${color #2A352F}${stippled_hr 1}$color${voffset 2}
${if_up wlxe84e064fbde7}${color4}IP:${color} ${addr wlxe84e064fbde7}${alignr}${color4}SSID:${color} ${wireless_essid wlxe84e064fbde7}
${color4}▼ Down:${color} ${downspeedf wlxe84e064fbde7} kB/s${alignr}${color4}▲ Up:${color} ${upspeedf wlxe84e064fbde7} kB/s
${color0}${downspeedgraph wlxe84e064fbde7 18,140 2A352F 9CAF88 -t -l} ${color1}${upspeedgraph wlxe84e064fbde7 18,140 2A352F 9CAF88 -t -l}$color
${color4}Total ▼ ${color}${totaldown wlxe84e064fbde7}${alignr}${color4}Total ▲ ${color}${totalup wlxe84e064fbde7}$color
${else}${color6}󰖪 Interface offline — verifique o WiFi USB$color
${endif}${voffset 2}
${font Hack Nerd Font:size=9:bold}${color1}❧ FAUNA · TOP $color$font${color #2A352F}${stippled_hr 1}$color${voffset 2}
${color4}CPU:${color}
${color2}1.${color} ${top name 1}${goto 150}${color4}${top pid 1}${alignr}${color} ${top cpu 1}%
${color2}2.${color} ${top name 2}${goto 150}${color4}${top pid 2}${alignr}${color} ${top cpu 2}%
${color2}3.${color} ${top name 3}${goto 150}${color4}${top pid 3}${alignr}${color} ${top cpu 3}%
${voffset 2}${color #2A352F}${stippled_hr 1}$color
${alignc}${font Hack Nerd Font:size=9:bold}${color1}❧ BTC ❧$font$color
${alignc}${font Hack Nerd Font:size=17:bold}${color2}${execi 60 ~/.config/conky/scripts/btc.sh}$font$color
${alignc}${color4}USD · 60s$color
]]
